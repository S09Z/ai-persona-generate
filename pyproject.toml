[project]
name = "idol-generate"
version = "0.1.0"
description = "AI Idol content generation system – Stable Diffusion + ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "av>=14.2.0",
    "beautifulsoup4>=4.12",
    "blake3>=1.0.8",
    "comfy-aimdo>=0.2.12",
    "comfy-kitchen>=0.2.8",
    "comfyui-embedded-docs==0.4.3",
    "comfyui-frontend-package==1.42.10",
    "comfyui-workflow-templates==0.9.44",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "filelock>=3.25.2",
    "glfw>=2.10.0",
    "httpx>=0.28.1",
    "instaloader>=4.15.1",
    "kornia>=0.7.1",
    "omegaconf>=2.3.0",
    "pillow>=12.1.1",
    "playwright>=1.58.0",
    "psutil>=7.2.2",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl>=3.1.10",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "safetensors>=0.7.0",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "simpleeval>=1.0.0",
    "spandrel>=0.4.2",
    "sqlalchemy>=2.0.49",
    "tensorboard>=2.20.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchsde>=0.2.6",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.3",
    "websocket-client>=1.9.0",
]

[project.scripts]
idol-generate = "idol_generate.__main__:main"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["vendor/ComfyUI"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idol_generate"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long - handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation must precede local imports in standalone scripts
"generate.py" = ["E402"]
"first_image.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["idol_generate"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
