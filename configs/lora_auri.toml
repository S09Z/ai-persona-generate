# ── LoRA training config for Auri (RealVisXL_V4.0 / SDXL) ────────────────────
# Used by: uv run train_lora.py --config configs/lora_auri.toml
#
# Source dataset : datasets/instagram/jel___ly  (195 images)
# Persona        : characters/auri.json
# Trigger word   : auri_v1
#
# 195 images x 5 repeats = 975 steps/epoch
# 12 epochs = ~11,700 total steps  ->  strong face LoRA

[general]
enable_bucket          = true
min_bucket_reso        = 512
max_bucket_reso        = 1024
bucket_reso_steps      = 64
bucket_no_upscale      = false

[datasets]
[[datasets.subsets]]
image_dir         = "datasets/lora/auri_v1/5_auri_v1"   # 5 repeats (195 images is large)
caption_extension = ".txt"
num_repeats       = 5

# ── Model ─────────────────────────────────────────────────────────────────────
[model]
pretrained_model_name_or_path = "models/checkpoints/RealVisXL_V4.0"
v2                            = false
v_parameterization            = false
sdxl                          = true

# ── Output ────────────────────────────────────────────────────────────────────
[output]
output_dir           = "models/loras"
output_name          = "auri_v1"
save_model_as        = "safetensors"
save_every_n_epochs  = 2

# ── Training hyperparameters ──────────────────────────────────────────────────
[train]
max_train_epochs            = 12
train_batch_size            = 1
resolution                  = "1024,1024"
mixed_precision             = "bf16"
optimizer_type              = "AdamW"           # AdamW safe on MPS
learning_rate               = 1e-4
unet_lr                     = 1e-4
text_encoder_lr             = 5e-5
lr_scheduler                = "cosine_with_restarts"
lr_warmup_steps             = 150               # slightly longer warmup for larger dataset
lr_scheduler_num_cycles     = 3
gradient_checkpointing      = true
gradient_accumulation_steps = 4
seed                        = 42
clip_skip                   = 2

# ── LoRA network ──────────────────────────────────────────────────────────────
[lora]
network_module          = "networks.lora"
network_dim             = 32                    # rank 32: good balance face + style
network_alpha           = 16
network_train_unet_only = false

# ── Caption / augmentation ────────────────────────────────────────────────────
# Auri appearance keywords injected by prepare_dataset.py from auri.json
[caption]
shuffle_caption                 = true
keep_tokens                     = 1             # auri_v1 always stays first
caption_dropout_rate            = 0.05
caption_dropout_every_n_epochs  = 4

# ── Logging ───────────────────────────────────────────────────────────────────
[logging]
log_with     = "tensorboard"
logging_dir  = "logs/lora_auri"

# ── Sample preview images every N epochs ─────────────────────────────────────
[sample]
sample_every_n_epochs = 2
sample_sampler        = "euler_a"
sample_prompts = [
    "auri_v1, portrait photo of a young woman, light sky blue eyes, short amber brown hair, snow white skin, soft smile, golden hour, 85mm lens, shallow depth of field",
    "auri_v1, casual fashion, cafe setting, soft natural light, elegant and approachable",
    "auri_v1, beach walk, warm sunlight, curvy fit body, fresh and natural look",
]
